[package]
name = "kg-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = {version = "0.6.8", features = ["cors"]}
pdf-extract = "0.10.0"
memmap2 = "0.9"
anyhow = "1.0"
rand = "0.10.0"
ort = "2.0.0-rc.11" # ONX runtime bindings
tokenizers = "0.19" # Fast Rust Tokenization
ndarray = "0.15" # For handling the resulting vectors
fastembed = "5.13.2"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
thiserror = "2.0.18"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
reqwest = { version = "0.13.2", features = ["json"] }
blake3 = "1.8.4"
dotenvy = "0.15.7"


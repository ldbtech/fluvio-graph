[workspace]
resolver = "2"
members = [
    # Shared crates
    "crates/fluvio-types",
    "crates/fluvio-common",
    "crates/fluvio-auth",
    "crates/fluvio-embed",

    # Services
    "services/fluvio-database",
    "services/fluvio-graph",
    "services/fluvio-twin",
    "services/fluvio-collab",
    "services/fluvio-ingestion",
    "services/fluvio-collab",
]

[workspace.dependencies]
fluvio-types  = { path = "crates/fluvio-types" }
fluvio-common = { path = "crates/fluvio-common" }
fluvio-auth   = { path = "crates/fluvio-auth" }
fluvio-embed  = { path = "crates/fluvio-embed" }

tokio        = { version = "1",   features = ["full"] }
tokio-util   = { version = "0.7" }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3" }
async-trait  = { version = "0.1" }

axum       = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

async-graphql      = { version = "7", features = ["uuid", "chrono"] }
async-graphql-axum = { version = "7" }

serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

sqlx      = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "macros"] }
surrealdb = { version = "3.0.5", default-features = true, features = ["kv-surrealkv"] }

jsonwebtoken = { version = "9" }
oauth2       = { version = "5" }

fastembed = { version = "5.13.2" }
ort       = { version = "2.0.0-rc.11" }
ndarray   = { version = "0.15" }

uuid   = { version = "1", features = ["v4", "serde"] }
blake3 = { version = "1" }

chrono = { version = "0.4", features = ["serde"] }

reqwest = { version = "0.13", features = ["json", "form", "stream"] }

anyhow    = { version = "1" }
thiserror = { version = "2" }

tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy     = { version = "0.15" }
bytes       = { version = "1" }
rand        = { version = "0.8" }
base64      = { version = "0.22" }
regex       = { version = "1" }
pdf-extract = { version = "0.10" }
memmap2     = { version = "0.9" }
image       = { version = "0.25", default-features = false, features = ["jpeg"] }

dashmap = { version = "6" }
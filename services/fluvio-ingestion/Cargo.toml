[package]
name    = "fluvio-ingestion"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fluvio-types  = { workspace = true }
fluvio-common = { workspace = true }
fluvio-embed  = { workspace = true }

tokio         = { workspace = true }
axum          = { workspace = true, optional = true }
tower-http    = { workspace = true, optional = true }

async-graphql      = { workspace = true, optional = true }
async-graphql-axum = { workspace = true, optional = true }

serde         = { workspace = true }
serde_json    = { workspace = true }

reqwest       = { workspace = true }
uuid          = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy       = { workspace = true }
chrono        = { workspace = true }

# File parsing
pdf-extract   = { workspace = true }
memmap2       = { workspace = true }

# Concurrent job store
dashmap       = { workspace = true }

# Tokenizer for chunk size counting
tokenizers    = { workspace = true }

# Embeddings
fastembed     = { workspace = true }
[features]
default = []
server  = ["dep:axum", "dep:tower-http", "dep:async-graphql", "dep:async-graphql-axum", "fluvio-common/server"]

[[bin]]
name = "fluvio-ingestion"
path = "src/main.rs"
required-features = ["server"]

[project]
name = "fluvio-tool-builder"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "strawberry-graphql[fastapi]>=0.243",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "reportlab>=4.1.0",
    "psycopg2-binary>=2.9.9",
    "docker>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

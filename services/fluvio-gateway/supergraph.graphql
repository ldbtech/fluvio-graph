{
  createUser(input: CreateUserInput!): GqlUser! @join__field(graph: FLUVIO_DATABASE)
  createGroup(input: CreateGroupInput!): GqlGroup! @join__field(graph: FLUVIO_DATABASE)
  addMember(input: AddMemberInput!): GqlMember! @join__field(graph: FLUVIO_DATABASE)
  updateMemberRole(groupId: String!, userId: String!, newRole: String!): GqlMember! @join__field(graph: FLUVIO_DATABASE)
  removeMember(groupId: String!, userId: String!): Boolean! @join__field(graph: FLUVIO_DATABASE)
  createInvite(input: CreateInviteInput!): GqlInvite! @join__field(graph: FLUVIO_DATABASE)
  acceptInvite(token: String!, acceptedBy: String!): GqlInvite! @join__field(graph: FLUVIO_DATABASE)
  submitToQueue(input: SubmitToQueueInput!): GqlQueueItem! @join__field(graph: FLUVIO_DATABASE)
  updateQueueStatus(input: UpdateQueueStatusInput!): GqlQueueItem! @join__field(graph: FLUVIO_DATABASE)

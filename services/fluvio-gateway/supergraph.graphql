type Mutation
  @join__type(graph: FLUVIO_GRAPH)
  @join__type(graph: FLUVIO_INGESTION)
{
  upsertNode(input: GqlNodeInput!): GqlNode! @join__field(graph: FLUVIO_GRAPH)
  deleteNode(id: String!): Boolean! @join__field(graph: FLUVIO_GRAPH)
  upsertEdge(input: GqlEdgeInput!): GqlEdge! @join__field(graph: FLUVIO_GRAPH)
  saveGraph(zone: Int): GqlSaveResult! @join__field(graph: FLUVIO_GRAPH)
  deleteUserGraph: Boolean! @join__field(graph: FLUVIO_GRAPH)

  """
  Upload and ingest a file (PDF, TXT, MD).
  Returns immediately with a jobId — processing runs in background.
  """
  ingestFile(file: Upload!, filename: String!, zone: Int): GqlIngestResult! @join__field(graph: FLUVIO_INGESTION)

  """
  Ingest raw text directly — no file upload needed.
  Runs synchronously since text is small.
  """
  ingestRaw(text: String!, sourceUri: String!, domain: String, zone: Int): GqlIngestResult! @join__field(graph: FLUVIO_INGESTION)
}

type Query
  @join__type(graph: FLUVIO_GRAPH)
  @join__type(graph: FLUVIO_INGESTION)
  @join__type(graph: FLUVIO_TWIN)
{
  """Fetch a single node by ID."""
  node(id: String!): GqlNode @join__field(graph: FLUVIO_GRAPH)

  """
  Fetch all nodes for the authenticated user, optionally filtered by domain.
  """
  nodes(domain: String, zone: Int): [GqlNode!]! @join__field(graph: FLUVIO_GRAPH)

  """
  Semantic similarity search — returns top-K nodes closest to the query.
  Goes directly to SurrealDB — no in-memory subgraph needed.
  """
  search(query: String!, config: GqlQueryConfig): [GqlScoredNode!]! @join__field(graph: FLUVIO_GRAPH)

  """
  Cross-user semantic search — "who in my network knows about X?"
  Zone 1 required — searches across connected users' nodes.
  """
  networkSearch(query: String!, userIds: [String!]!, topK: Int): [GqlScoredNode!]! @join__field(graph: FLUVIO_GRAPH)

  """
  BFS expansion — returns all nodes within `depth` hops of the given node.
  Served directly from SurrealDB for depth <= 3.
  """
  neighbors(id: String!, depth: Int): [GqlNode!]! @join__field(graph: FLUVIO_GRAPH)

  """
  Dual-weight Dijkstra shortest path between two nodes.
  Builds a request-scoped QueryContext — dropped after this resolver returns.
  """
  shortestPath(from: String!, to: String!): GqlPath! @join__field(graph: FLUVIO_GRAPH)

  """Get the status of an ingestion job by ID."""
  ingestJob(jobId: String!): GqlIngestJob @join__field(graph: FLUVIO_INGESTION)

  """
  Ask a question over the user's knowledge graph.
  
  Pipeline:
  1. Semantic search in fluvio-graph (top-K nodes)
  2. BFS expansion for each seed (graph context)
  3. Assemble knowledge context
  4. Call Claude with context + question
  5. Return grounded answer + sources
  """
  chat(question: String!, history: [GqlChatMessage!], topK: Int, zone: Int): GqlChatResponse! @join__field(graph: FLUVIO_TWIN)

  """List all documents (graph nodes) in the user's knowledge graph."""
  documents(zone: Int): [GqlDocument!]! @join__field(graph: FLUVIO_TWIN)
}

"""A multipart file upload"""
scalar Upload
  @join__type(graph: FLUVIO_INGESTION)
  getPendingCompanyInvites(email: String!): [GqlCompanyInvite!]! @join__field(graph: FLUVIO_DATABASE)
  getCompanyTeams(companyId: String!): [GqlTeam!]! @join__field(graph: FLUVIO_DATABASE)
  getCompanyUsers(companyId: String!): [GqlUser!]! @join__field(graph: FLUVIO_DATABASE)
  getTeam(id: String!): GqlTeam @join__field(graph: FLUVIO_DATABASE)
  getTeamMembers(teamId: String!): [GqlTeamMember!]! @join__field(graph: FLUVIO_DATABASE)
  getTeamWorkflows(teamId: String!): [GqlTeamWorkflow!]! @join__field(graph: FLUVIO_DATABASE)
  plannerChatHistory(workspaceId: String!): [GqlPlannerChatMessage!]! @join__field(graph: FLUVIO_DATABASE)
  companyExecutionLogs(companyId: String!, limit: Int): [GqlExecutionLog!]! @join__field(graph: FLUVIO_DATABASE)
  companyActionAuthorizations(companyId: String!, status: String): [GqlActionAuthorization!]! @join__field(graph: FLUVIO_DATABASE)
  companyDocumentReconciliations(companyId: String!): [GqlDocumentReconciliation!]! @join__field(graph: FLUVIO_DATABASE)
  companyPipelineRuns(companyId: String!): [GqlPipelineRun!]! @join__field(graph: FLUVIO_DATABASE)

  """Fetch a single node by ID."""
  node(id: String!): GqlNode @join__field(graph: FLUVIO_GRAPH)

  """
  Fetch all nodes for the authenticated user, optionally filtered by domain.
  """
  nodes(domain: String, zone: Int, workspaceId: String): [GqlNode!]! @join__field(graph: FLUVIO_GRAPH)

  """
  Semantic similarity search — returns top-K nodes closest to the query.
  Goes directly to SurrealDB — no in-memory subgraph needed.
  """
  search(query: String!, config: GqlQueryConfig, workspaceId: String): [GqlScoredNode!]! @join__field(graph: FLUVIO_GRAPH)

  """
  Cross-user semantic search — "who in my network knows about X?"
  Zone 1 required — searches across connected users' nodes.
  """
  networkSearch(query: String!, userIds: [String!]!, topK: Int): [GqlScoredNode!]! @join__field(graph: FLUVIO_GRAPH)

  """
  BFS expansion — returns all nodes within `depth` hops of the given node.
  Served directly from SurrealDB for depth <= 3.
  """
  neighbors(id: String!, depth: Int): [GqlNode!]! @join__field(graph: FLUVIO_GRAPH)

  """
  Dual-weight Dijkstra shortest path between two nodes.
  Builds a request-scoped QueryContext — dropped after this resolver returns.
  """
  shortestPath(from: String!, to: String!): GqlPath! @join__field(graph: FLUVIO_GRAPH)

  """Get the status of an ingestion job by ID."""
  ingestJob(jobId: String!): GqlIngestJob @join__field(graph: FLUVIO_INGESTION)

  """List all available tools."""
  availableTools: [GqlTool!]! @join__field(graph: FLUVIO_TOOL_BUILDER)

  """Retrieve the execution history, optionally filtered by tool ID."""
  toolExecutionHistory(toolId: String = null): [GqlToolRun!]! @join__field(graph: FLUVIO_TOOL_BUILDER)

  """
  Ask a question over the user's knowledge graph.
  
  Pipeline:
  1. Semantic search in fluvio-graph (top-K nodes)
  2. BFS expansion for each seed (graph context)
  3. Assemble knowledge context
  4. Call Claude with context + question
  5. Return grounded answer + sources
  """
  chat(question: String!, history: [GqlChatMessage!], topK: Int, zone: Int, workspaceId: String): GqlChatResponse! @join__field(graph: FLUVIO_TWIN)

  """List all documents (graph nodes) in the user's knowledge graph."""
  documents(zone: Int, workspaceId: String): [GqlDocument!]! @join__field(graph: FLUVIO_TWIN)
}


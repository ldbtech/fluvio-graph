supergraph:
  listen: 0.0.0.0:4001
  introspection: true

sandbox:
  enabled: true

homepage:
  enabled: false

cors:
  allow_any_origin: true
  allow_headers:
    - content-type
    - x-user-id
    - apollo-require-preflight
    - x-apollo-operation-name

include_subgraph_errors:
  all: true

headers:
  all:
    request:
      - propagate:
          named: x-user-id



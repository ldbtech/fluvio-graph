supergraph:
  listen: 0.0.0.0:4001
  introspection: true

sandbox:
  enabled: true

homepage:
  enabled: false

cors:
  allow_any_origin: true
  allow_headers:
    - content-type
    - x-user-id
    - x-fluviome-token
    - apollo-require-preflight
    - x-apollo-operation-name

include_subgraph_errors:
  all: true

headers:
  all:
    request:
      - propagate:
          named: x-user-id
      # Enterprise token forwarded to subgraphs so they can gate features.
      # Set FLUVIOME_ENTERPRISE_TOKEN in .env; absent = community mode.
      - propagate:
          named: x-fluviome-token

# Enterprise token coprocessor — uncomment when fluviome.com token service is live.
# Until then the engine runs in headless community mode with no auth layer.
#
# coprocessor:
#   url: http://127.0.0.1:4002
#   router:
#     request:
#       headers: true
#       body: false

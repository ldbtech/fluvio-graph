[project]
name = "fluvio-connectors"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "strawberry-graphql[fastapi]>=0.243",
    "httpx>=0.27",
    "PyGithub>=2.4",
    "notion-client>=2.2",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "aiofiles>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

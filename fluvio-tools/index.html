<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Fluvio Tools</title>
    <style>
      :root {
        --bg: #0a0a10;
        --panel: #12121a;
        --border: #2a2a38;
        --text: #e8e8f0;
        --muted: #8888a0;
        --accent: #6b8cff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
      #app { display: flex; height: 100%; min-height: 0; }
      #sidebar {
        width: 320px; flex-shrink: 0; border-right: 1px solid var(--border);
        background: var(--panel); overflow: auto; padding: 12px 14px 20px;
        display: flex; flex-direction: column; gap: 14px;
      }
      #canvas-wrap { flex: 1; min-width: 0; min-height: 0; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }

      #tool-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
      .tool-tab {
        padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
        background: transparent; color: var(--text); cursor: pointer; font-size: 13px;
      }
      .tool-tab:hover { border-color: var(--muted); }
      .tool-tab.active { border-color: var(--accent); background: rgba(107, 140, 255, 0.12); }

      #tool-controls { font-size: 13px; }
      .ctrl-section { margin-bottom: 12px; }
      .ctrl-label { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
      .ctrl-row { margin-bottom: 8px; }
      .ctrl-row label { display: block; margin-bottom: 4px; color: var(--muted); }
      select {
        width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--bg); color: var(--text); font-size: 13px;
      }
      input[type="range"] { width: 100%; }

      #mat-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 140px; overflow-y: auto; }
      .mat-chip {
        display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px;
        border: 1px solid var(--border); font-size: 11px; cursor: pointer; color: var(--muted);
      }
      .mat-chip.active { border-color: var(--accent); color: var(--text); }
      .mat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

      .row-btns { display: flex; flex-wrap: wrap; gap: 6px; }
      .row-btns button {
        flex: 1; min-width: 90px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px;
      }
      .row-btns button:hover { border-color: var(--accent); }

      #stats { font-size: 12px; color: var(--muted); line-height: 1.5; }
      #stats strong { color: var(--text); }

      #json-out {
        font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.45;
        white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto;
        padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #08080c;
        margin: 0;
      }
      .json-key { color: #9cdcfe; }
      .json-str { color: #ce9178; }
      .json-num { color: #b5cea8; }
      .json-bool { color: #569cd6; }

      #loading-overlay {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(10, 10, 16, 0.65); font-size: 14px; color: var(--text); pointer-events: none;
      }
      #loading-overlay.visible { display: flex; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="tool-tabs"></div>
        <div id="tool-controls"></div>
        <div class="ctrl-section">
          <div class="ctrl-label">MATERIAL</div>
          <select id="mat-select"></select>
        </div>
        <div id="mat-chips"></div>
        <div class="ctrl-section">
          <div class="ctrl-label">ENVIRONMENT</div>
          <select id="env-select">
            <option value="dark" selected>dark</option>
            <option value="warm">warm</option>
            <option value="cool">cool</option>
            <option value="bright">bright</option>
          </select>
        </div>
        <div class="ctrl-row">
          <label>Rotation speed <span id="rot-val">0.5</span></label>
          <input type="range" id="rot-speed" min="0" max="3" step="0.1" value="0.5" />
        </div>
        <div class="ctrl-row">
          <label>Key light <span id="light-val">1.4</span></label>
          <input type="range" id="light-intensity" min="0.2" max="4" step="0.1" value="1.4" />
        </div>
        <div class="row-btns">
          <button type="button" id="btn-rebuild">Rebuild</button>
          <button type="button" id="btn-reset-cam">Reset camera</button>
          <button type="button" id="btn-wireframe">Wireframe</button>
          <button type="button" id="btn-export">Export JSON</button>
        </div>
        <div id="stats">
          <div><strong id="s-polys">—</strong> tris · <strong id="s-objs">—</strong> meshes</div>
          <div><span id="poly-count">—</span> · <span id="obj-count">—</span></div>
          <div>W <strong id="s-w">—</strong> · H <strong id="s-h">—</strong></div>
        </div>
        <div class="ctrl-section">
          <div class="ctrl-label">SPEC (JSON)</div>
          <pre id="json-out"></pre>
        </div>
      </aside>
      <div id="canvas-wrap">
        <div id="loading-overlay">Building…</div>
      </div>
    </div>
    <script type="module" src="/src/sandbox/index.ts"></script>
  </body>
</html>

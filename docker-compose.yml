# fluvioMe — Headless Engine
# License: BUSL-1.1  |  Change Date: 4 years from first release → Apache-2.0
#
# Quick start (community / non-profit / individual):
#   docker compose up
#
# Enterprise (for-profit orgs at any scale):
#   FLUVIOME_ENTERPRISE_TOKEN=<your-token-from-fluviome.com> docker compose up
#
# The engine is auth-free by default. Pass x-user-id in your requests or put
# your own auth proxy in front of the gateway (:4001).


# ── Shared defaults ───────────────────────────────────────────────────────────

x-common-env: &common-env
  # ws:// not http:// — the `surrealdb` crate is built with its default
  # `protocol-ws` feature only; `protocol-http` isn't enabled, so an http://
  # URL fails at connect time with "HTTP remote engine ... not enabled".
  SURREAL_URL: ws://surrealdb:8000
  DATABASE_URL: postgresql://fluviome:fluviome@postgres:5432/fluviome
  # No /graphql suffix — Apollo Router serves the GraphQL endpoint at root
  # (router.yaml sets no `supergraph.path`, which defaults to /). This had a
  # spurious /graphql suffix, so agent-planner's every gateway call 404'd —
  # matches agent-planner's own correct default of http://127.0.0.1:4001.
  GATEWAY_URL: http://gateway:4001
  # Never set anywhere before — twin-server, collab-server, and
  # ingestion-server all default to localhost:3001/3004 when these are
  # unset, which inside their own containers means "myself", not
  # fluvio-graph/fluvio-ingestion. Broke twin chat's RAG search entirely
  # under docker-compose (collab-server and ingestion-server too).
  GRAPH_GRAPHQL_URL: http://fluvio-graph:3001/graphql
  INGESTION_GRAPHQL_URL: http://fluvio-ingestion:3004/graphql
  FLUVIOME_ENTERPRISE_TOKEN: ${FLUVIOME_ENTERPRISE_TOKEN:-}
  # Deployment-level fallback LLM provider — used by fluvio-database's
  # internal credential resolver when a user hasn't connected their own
  # provider (Settings → Connections). Only fluvio-database reads these;
  # twin-server/collab-server/agent-planner resolve per-request via it, so
  # they no longer need — or hard-fail without — a key at boot.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-}
  # e.g. http://host.docker.internal:11434 to reach `ollama serve` running on
  # the host machine (needs extra_hosts: host.docker.internal:host-gateway,
  # already set on the services that make LLM calls).
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-}
  # AES-256-GCM key (32 raw bytes, base64) for encrypting per-user BYOK LLM
  # credentials at rest. Optional — fluvio-database still boots without it;
  # BYOK connect/resolve operations error until it's set. Generate with:
  #   openssl rand -base64 32
  FLUVIOME_CREDENTIAL_KEY: ${FLUVIOME_CREDENTIAL_KEY:-}
  # Optional shared secret guarding fluvio-database's internal (non-GraphQL,
  # non-public) credential-resolution route. Recommended whenever backend
  # ports are reachable beyond localhost — every service in this compose
  # file host-publishes its port today.
  FLUVIOME_INTERNAL_SECRET: ${FLUVIOME_INTERNAL_SECRET:-}
  # Bare base URL (not /graphql-suffixed) for fluvio-database's internal
  # credential-resolution route.
  DATABASE_SERVICE_URL: http://fluvio-database:3005

x-restart: &restart
  restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Data stores ─────────────────────────────────────────────────────────────

  # The surrealdb image runs as a non-root user (uid/gid 65532). Docker
  # creates named volumes owned by root:root, so surrealdb can't write to
  # /data until we chown it once here.
  surrealdb-init:
    image: alpine:latest
    command: chown -R 65532:65532 /data
    volumes:
      - surreal_data:/data
    restart: "no"

  surrealdb:
    image: surrealdb/surrealdb:latest
    <<: *restart
    command: start --log info --user root --pass root surrealkv://data
    volumes:
      - surreal_data:/data
    ports:
      - "8000:8000"
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    healthcheck:
      # The surrealdb image ships no shell/curl, so use its own is-ready subcommand.
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: fluviome
      POSTGRES_PASSWORD: fluviome
      POSTGRES_DB: fluviome
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluviome"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Rust subgraphs ───────────────────────────────────────────────────────────

  fluvio-graph:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: fluvio-graph
    <<: *restart
    environment:
      <<: *common-env
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      surrealdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluvio-twin:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: fluvio-twin
    <<: *restart
    environment:
      <<: *common-env
      PORT: 3002
    # Lets an Ollama connection's baseUrl use host.docker.internal to reach a
    # model server running on the host (e.g. `ollama serve`), instead of a
    # network-specific gateway IP that can change if the network is recreated.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    depends_on:
      surrealdb:
        condition: service_healthy
      fluvio-database:
        condition: service_healthy
      fluvio-graph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluvio-database:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: fluvio-database
    <<: *restart
    environment:
      <<: *common-env
      PORT: 3005
      COMPANY_DATABASE_URL: postgresql://fluviome:fluviome@postgres:5432/fluvio_company
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3005/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluvio-ingestion:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: fluvio-ingestion
    <<: *restart
    environment:
      <<: *common-env
      PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      surrealdb:
        condition: service_healthy
      fluvio-database:
        condition: service_healthy
      fluvio-graph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3004/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluvio-collab:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: fluvio-collab
    <<: *restart
    environment:
      <<: *common-env
      PORT: 3003
      # /graphql-suffixed, unlike the bare common-env default — this
      # service's DatabaseClient needs the GraphQL endpoint; it strips the
      # suffix itself when building the (separate) internal credential
      # resolver. Previously unset entirely, which meant DatabaseClient
      # silently fell back to localhost:3005/graphql — unreachable in the
      # docker network.
      DATABASE_SERVICE_URL: http://fluvio-database:3005/graphql
      # Collaboration features require an enterprise token.
      # Without FLUVIOME_ENTERPRISE_TOKEN this service starts but gates features.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3003:3003"
    depends_on:
      surrealdb:
        condition: service_healthy
      fluvio-database:
        condition: service_healthy
      fluvio-graph:
        condition: service_healthy
      fluvio-ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Python services ──────────────────────────────────────────────────────────

  fluvio-connectors:
    build:
      context: services/fluvio-connectors
      dockerfile: Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      PORT: 3006
    ports:
      - "3006:3006"
    depends_on:
      fluvio-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3006/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluvio-tool-builder:
    build:
      context: services/fluvio-tool-builder
      dockerfile: Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      PORT: 3008
    ports:
      - "3008:3008"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3008/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-planner:
    build:
      # Repo root: the image needs the sibling packages/fluvio-planner package.
      context: .
      dockerfile: services/agent-planner/Dockerfile
    <<: *restart
    environment:
      <<: *common-env
      PORT: 3007
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3007:3007"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3007/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Apollo Router (GraphQL API — the headless entry point) ───────────────────

  gateway:
    build:
      context: gateway
      dockerfile: Dockerfile
    <<: *restart
    environment:
      FLUVIOME_ENTERPRISE_TOKEN: ${FLUVIOME_ENTERPRISE_TOKEN:-}
    ports:
      - "4001:4001"   # ← THIS is the public API surface. Point your SDK/clients here.
    depends_on:
      fluvio-graph:
        condition: service_healthy
      fluvio-twin:
        condition: service_healthy
      fluvio-database:
        condition: service_healthy
      fluvio-ingestion:
        condition: service_healthy
      fluvio-tool-builder:
        condition: service_healthy
    healthcheck:
      # Apollo Router serves /health on its own listener (default 8088), not
      # the GraphQL port (4001) — hitting 4001/health always 404s.
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── Enterprise coprocessor (only active when FLUVIOME_ENTERPRISE_TOKEN is set) ─
  # Gating: collaboration, SSO, audit logs, multi-tenant, white-label

  enterprise-gate:
    build:
      context: services/fluvio-auth
      dockerfile: Dockerfile
    <<: *restart
    environment:
      FLUVIOME_ENTERPRISE_TOKEN: ${FLUVIOME_ENTERPRISE_TOKEN:-}
      FLUVIOME_PUBLIC_KEY: ${FLUVIOME_PUBLIC_KEY:-}
      FLUVIOME_ENTERPRISE_COPROCESSOR_PORT: 4002
    ports:
      - "4002:4002"
    profiles:
      - enterprise  # only starts with: docker compose --profile enterprise up
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  surreal_data:
  pg_data:
